<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uni-Fin Test Paneli</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 20px auto; padding: 10px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    #progressWrap { width: 100%; height: 10px; background: #eee; border-radius: 4px; margin-bottom: 10px; }
    #progressBar { height: 10px; width: 0%; background: #4f46e5; border-radius: 4px; }
    .options { display: grid; gap: 8px; margin-top: 10px; }
    button { padding: 10px; border: 0; border-radius: 8px; background: #111827; color: white; cursor: pointer; }
    #timer { font-weight: bold; color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Uni-Fin Kompozit Test</h2>
    <p>Süre: <span id="timer">30</span> sn</p>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <p id="counter">0/100</p>
    <h3 id="question"></h3>
    <div id="options" class="options"></div>
    <div id="result"></div>
    <button id="startBtn">Testi Başlat</button>
  </div>
<script>
let sessionId = null;
let total = 100;
let localTimer = null;

const startBtn = document.getElementById('startBtn');
const timerEl = document.getElementById('timer');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const counterEl = document.getElementById('counter');
const resultEl = document.getElementById('result');
const progressBar = document.getElementById('progressBar');

async function post(url, data) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data || {})});
  return r.json();
}

async function loadQuestion() {
  const data = await post('/get-question', {session_id: sessionId});
  if (data.done) return finish();
  const q = data.question;
  timerEl.textContent = data.remaining_seconds;
  counterEl.textContent = `${data.index}/${total}`;
  progressBar.style.width = `${(data.index / total) * 100}%`;
  questionEl.textContent = q.text;
  questionEl.style.color = q.type === 'stroop' ? (q.display_color || 'black') : 'black';
  optionsEl.innerHTML = '';
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.textContent = opt.label;
    b.onclick = () => submit(q.id, opt.value);
    optionsEl.appendChild(b);
  });
}

async function submit(questionId, answer) {
  await post('/submit-answer', {session_id: sessionId, question_id: questionId, answer});
  loadQuestion();
}

async function finish() {
  clearInterval(localTimer);
  const data = await post('/finish-test', {session_id: sessionId});
  questionEl.textContent = 'Test tamamlandı';
  optionsEl.innerHTML = '';
  resultEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
}

startBtn.onclick = async () => {
  resultEl.innerHTML = '';
  const s = await post('/start-test');
  sessionId = s.session_id;
  total = s.total_questions;
  startBtn.style.display = 'none';
  let remain = s.duration;
  timerEl.textContent = remain;
  clearInterval(localTimer);
  localTimer = setInterval(() => {
    remain -= 1;
    timerEl.textContent = Math.max(0, remain);
    if (remain <= 0) finish();
  }, 1000);
  loadQuestion();
};
</script>
</body>
</html>
